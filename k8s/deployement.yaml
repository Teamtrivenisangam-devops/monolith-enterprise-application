apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-application
  namespace: snowman

spec:
  replicas: 2

  selector:
    matchLabels:
      app: enterprise-application

  template:
    metadata:
      labels:
        app: enterprise-application

    spec:
      containers:
      - name: enterprise-application
        image: snowmanacr9207.azurecr.io/enterprise-application:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8090

        env:
        - name: JDBC_URL
          valueFrom:
            secretKeyRef:
              name: snowman-db-secret
              key: jdbc-url

        - name: JDBC_USERNAME
          valueFrom:
            secretKeyRef:
              name: snowman-db-secret
              key: jdbc-username

        - name: JDBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: snowman-db-secret
              key: jdbc-password
